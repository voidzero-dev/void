<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404: Not Found</title>
    <!-- inject:css -->
    <!--
      Do not add code here. At runtime, the file referenced by the tag below is
      inlined, replacing this entire block (including this comment).
      The tag is kept so you can preview this HTML file by opening it directly in a browser.
    -->

    <!-- endinject -->
    <!-- inject:js -->
    <!--
      Do not add code here. At runtime, the file referenced by the tag below is
      inlined, replacing this entire block (including this comment).
      The tag is kept so you can preview this HTML file by opening it directly in a browser.
    -->
    <script src="./script.js"></script>

  </head>
  <body>
    <div class="error-page">
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <main class="error-content">
        <span class="grid-tick top left" aria-hidden="true"></span>
        <span class="grid-tick top right" aria-hidden="true"></span>
        <span class="grid-tick bottom left" aria-hidden="true"></span>
        <span class="grid-tick bottom right" aria-hidden="true"></span>
        <h1>
          <span class="error-code">404</span><span class="error-title">Lost in the void</span>
        </h1>
        <p class="error-description">This page doesn't exist</p>
        <button class="error-action" type="button" id="void-error-back" hidden>
          <span class="error-arrow" aria-hidden="true">←</span>Go back
        </button>
      </main>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <canvas class="error-texture" aria-hidden="true"></canvas>
    </div>
  </body>
