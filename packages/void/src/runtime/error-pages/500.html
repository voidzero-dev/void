<!doctype html>
<html lang="en">
  <head>

    <title>500: Internal Server Error</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="void-error-page">
    <main class="void-error-content">
      <p class="void-error-status">500 · Internal server error</p>
      <h1>Something went wrong</h1>
      <p class="void-error-description">This page couldn’t load. Please try again in a moment.</p>
      <a class="void-error-action" href="">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12a9 9 0 1 1-2.636-6.364" />
          <path d="M21 3v6h-6" />
        </svg>
        Reload page
      </a>
    </main>

</html>
