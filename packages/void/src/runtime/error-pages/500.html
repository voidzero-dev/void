<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>500: Internal Server Error</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js"></script>
  </head>
  <body>
    <div class="error-page">
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <main class="error-content">
        <span class="grid-tick top left" aria-hidden="true"></span>
        <span class="grid-tick top right" aria-hidden="true"></span>
        <span class="grid-tick bottom left" aria-hidden="true"></span>
        <span class="grid-tick bottom right" aria-hidden="true"></span>
        <h1>
          <span class="error-code">500</span><span class="error-title">Something went wrong</span>
        </h1>
        <p class="error-description">Please try again in a moment</p>
        <a class="error-action" href=""
          ><span class="error-arrow" aria-hidden="true">↻</span>Reload page</a
        >
      </main>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <div class="grid-cell" aria-hidden="true"></div>
      <canvas class="error-texture" aria-hidden="true"></canvas>
    </div>
  </body>
</html>
