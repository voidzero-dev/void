  '@napi-rs/keyring': ^2.1.2
  happy-dom: ^21.0.4
  '@iconify/vue': 5.0.5
  '@react-router/dev': ^8.5.1
  arktype: ^2.2.9
  cron-parser: 5.10.4
  hono: ^4.13.18
  ignore: ^7.0.14
  jose: 6.2.17
  mime: ^4.1.2
  react-router: ^8.5.1
  smol-toml: ^1.9.1
  tslib: ^2.9.1
  vite-plugin-solid: ^2.11.16
  '@hono/node-server': ^2.1.6
  '@shikijs/engine-javascript': ^4.6.0
  '@shikijs/transformers': ^4.6.0
  markdown-exit: ^2.1.3
  markdown-it-anchor: ^10.1.0
  minimatch: ^11.0.7
  vue: ^3.5.45
  ci-info: ^4.5.0

catalogs:
  angular:
    typescript: 6.0.3
  platform:
    '@cloudflare/workers-types': ^5.20261110.1
    hono: 4.13.18
    wrangler: ^4.160.1
  sveltekit:
    typescript: 6.0.3

packageExtensions:
  # Analog's Nitro 2 plugin imports H3 v1 without declaring it.
  '@analogjs/vite-plugin-nitro@2.9.6':
    dependencies:
      h3: ^1.15.11
  # Analog imports TypeScript without declaring it; use the app's compiler.
  '@analogjs/vite-plugin-angular@*':
    peerDependencies:
      typescript: '*'

overrides:
  # Keep Vite+'s pinned Vitest internals on the same patch as the runner.
  '@vitest/mocker': 5.1.0
  '@vitest/pretty-format': 5.1.0
  '@vitest/snapshot': 5.1.0
  '@vitest/spy': 5.1.0
  '@vitest/utils': 5.1.0
  esbuild: ^0.28.2
  react-server-dom-webpack: 19.3.1
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    tailwindcss: '*'
    vite: '*'

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.11'
  - '@better-auth/drizzle-adapter@1.7.11'
  - '@better-auth/kysely-adapter@1.7.11'
  - '@better-auth/memory-adapter@1.7.11'
  - '@better-auth/mongo-adapter@1.7.11'
  - '@better-auth/prisma-adapter@1.7.11'
  - '@better-auth/telemetry@1.7.11'
  - '@cloudflare/*'
  - '@nkzw/*'
  - '@void/*'
  - '@voidzero-dev/*'
  - 'miniflare'
  - 'workerd'
  - 'wrangler'
  - better-auth@1.7.11
  - cf
  - hono
  - react-fate
  - void
  - void-fate
  - '@hono/node-server@2.1.5'
  - '@vitejs/plugin-rsc@0.5.37'
  - '@vue/compiler-core@3.5.44'
  - '@vue/compiler-dom@3.5.44'
  - '@vue/compiler-sfc@3.5.44'
  - '@vue/compiler-ssr@3.5.44'
  - '@vue/reactivity@3.5.44'
  - '@vue/runtime-core@3.5.44'
  - '@vue/runtime-dom@3.5.44'
  - '@vue/server-renderer@3.5.44'
  - '@vue/shared@3.5.44'
  - lucide-react@1.56.0
  - mysql2@3.24.6
  - vue@3.5.44
  - vite-plus@1.3.0 || 1.6.0
  - vitepress-plugin-group-icons@1.8.2
