  happy-dom: ^21.0.4
  '@iconify/vue': 5.0.5
  '@react-router/dev': ^8.5.1
  arktype: ^2.2.9
  cron-parser: 5.10.6
  hono: ^4.13.19
  ignore: ^7.0.14
  jose: 6.2.17
  mime: ^4.1.2
  react-router: ^8.5.1
  smol-toml: ^1.9.1
  tslib: ^2.9.1
  vite-plugin-solid: ^2.11.16
  '@hono/node-server': ^2.1.8
