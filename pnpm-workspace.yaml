packages:
  - docs
  - packages/*
  - platform
  - platform/packages/*
  - playground/*
  # Dependencies for the Kit 2 compatibility test; app source comes from the Kit 3 playground.
  - test/fixtures/sveltekit-v2

catalogMode: strict

allowBuilds:
  '@astryxdesign/core': false
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: false
  sharp: false
  vue-demi: false
  workerd: true

catalog:
  '@cloudflare/workers-types': ^5.20261110.1
  '@cloudflare/workers-utils': ^0.53.1
  '@types/node': ^26.6.6
  '@voidzero-dev/vite-plus-prompts': 1.6.0
  typescript: 7.0.2
  '@voidzero-dev/vitepress-theme': ^5.0.7
  pathslash: ^0.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  wrangler: ^4.160.1
  cf: ^1.0.0-beta.30
  oauth4webapi: ^3.8.8
  '@astryxdesign/core': 0.7.13
  '@astryxdesign/theme-neutral': 0.7.13
  '@stylexjs/stylex': 0.19.1
  '@angular/build': ^22.2.6
  '@astrojs/cloudflare': ^14.4.7
  '@cloudflare/build-output-utils': ^0.9.13
  '@cloudflare/codemods': ^0.7.7
  '@cloudflare/config': ^0.32.0
  '@cloudflare/vite-plugin': ^2.0.0-beta.v.15
  '@cloudflare/workers-auth': ^0.18.1
  '@nkzw/fate': 2.0.1
  '@vitejs/plugin-react': ^6.3.0
  '@vitejs/plugin-rsc': ^0.5.39
  astro: ^7.4.10
  magic-string: ^1.4.5
  # Keep Miniflare aligned with the Vite plugin, Wrangler, and cf.
  miniflare: ^5.20261110.1-beta
  nuxt: ^4.6.4
  playwright: ^1.65.0
  postal-mime: ^4.2.1
  react-fate: 2.0.1
  reka-ui: 2.11.0
  rolldown: ^1.3.1
  solid-js: ^1.9.19
  svelte: ^5.57.2
  shiki: ^4.6.0
  '@analogjs/content': ^2.9.6
  '@analogjs/platform': ^2.9.6
  '@analogjs/router': ^2.9.6
  '@analogjs/vite-plugin-angular': ^2.9.6
  '@angular/common': ^22.2.5
  '@angular/compiler': ^22.2.5
  '@angular/compiler-cli': ^22.2.5
  '@angular/core': ^22.2.5
  '@angular/platform-browser': ^22.2.5
  '@angular/platform-server': ^22.2.5
  '@angular/router': ^22.2.5
  '@electric-sql/pglite': 0.5.16
  '@sveltejs/adapter-cloudflare': ^8.0.1
  '@sveltejs/kit': ^3.1.0
  '@tanstack/react-router': ^1.170.46
  '@tanstack/react-start': ^1.169.5
  better-auth: ^1.7.20
  lucide-react: 1.71.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-server-dom-webpack: 19.3.1
  vinext: 1.4.5
  vitepress-plugin-group-icons: ^1.8.2
  vitepress-plugin-llms: ^1.15.0
