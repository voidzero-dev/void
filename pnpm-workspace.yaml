catalogs:
  angular:
    typescript: 6.0.3
  platform:
    '@cloudflare/workers-types': ^5.20261117.1
    hono: 4.13.19
    wrangler: ^4.163.0
  sveltekit:
    typescript: 6.0.3

packageExtensions:
  # Analog's Nitro 2 plugin imports H3 v1 without declaring it.
  '@analogjs/vite-plugin-nitro@2.9.7':
    dependencies:
      h3: ^1.15.11
  # Analog imports TypeScript without declaring it; use the app's compiler.
  '@analogjs/vite-plugin-angular@*':
    peerDependencies:
      typescript: '*'

overrides:
  # Keep Vite+'s pinned Vitest internals on the same patch as the runner.
  '@vitest/mocker': 5.1.0
  '@vitest/pretty-format': 5.1.0
  '@vitest/snapshot': 5.1.0
  '@vitest/spy': 5.1.0
  '@vitest/utils': 5.1.0
  esbuild: ^0.28.2
  react-server-dom-webpack: 19.3.1
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    tailwindcss: '*'
    vite: '*'

