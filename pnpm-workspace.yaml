packages:
  - benchmark
  - benchmark/*
  - docs
  - packages/*
  - platform
  - platform/packages/*
  - playground/*
  # Dependencies for the Kit 2 compatibility test; app source comes from the Kit 3 playground.
  - test/fixtures/sveltekit-v2

catalogMode: strict

update:
  ignoreDeps:
    # Angular and SvelteKit require TS 6. Review the workspace's TS 7 explicitly.
    - typescript
    # The Kit 2 fixture requires adapter 7. Review catalog Kit 3/adapter 8 explicitly.
    - '@sveltejs/kit'
    - '@sveltejs/adapter-cloudflare'

allowBuilds:
  '@astryxdesign/core': false
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: false
  sharp: false
  vue-demi: false
  workerd: true

catalog:
  '@cloudflare/workers-types': ^5.20261117.1
  '@cloudflare/workers-utils': ^0.54.1
  '@pierre/highlights': ^0.5.1
  '@types/node': ^26.6.6
  '@voidzero-dev/vite-plus-prompts': 1.6.0
  typescript: 7.0.2
  # Match the tsrs version bundled with vite-plus so `vp check` and `typecheck` agree.
  tsrs: 7.1.0-beta.tsrs2
  '@voidzero-dev/vitepress-theme': ^5.0.7
  pathslash: ^0.1.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  wrangler: ^4.163.0
  cf: 1.0.0-rc.0
  oauth4webapi: ^3.8.8
