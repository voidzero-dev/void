<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none">
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
    .label { font-size: 13px; font-weight: 600; }
    .detail { font-size: 12px; opacity: 0.7; }
    .route { font-size: 12px; font-weight: 600; }
    .box-outer { stroke: #7c3aed; fill: #7c3aed; fill-opacity: 0.08; }
    .box-mid { stroke: #2563eb; fill: #2563eb; fill-opacity: 0.08; }
    .box-inner { stroke: #059669; fill: #059669; fill-opacity: 0.08; }
  </style>

  <!-- Route label -->
  <text x="260" y="24" text-anchor="middle" class="route" fill="#6b7280">GET /users/42</text>

  <!-- Outer: pages/layout -->
  <rect x="16" y="40" width="488" height="264" rx="8" class="box-outer" stroke-width="1.5"/>
  <text x="32" y="62" class="label" fill="#7c3aed">pages/layout</text>
  <text x="32" y="82" class="detail" fill="#6b7280">&lt;nav&gt; 首页 | 用户 &lt;/nav&gt;</text>

  <!-- Middle: pages/users/layout -->
  <rect x="40" y="96" width="440" height="192" rx="8" class="box-mid" stroke-width="1.5"/>
  <text x="56" y="118" class="label" fill="#2563eb">pages/users/layout</text>
  <text x="56" y="138" class="detail" fill="#6b7280">&lt;aside&gt; 用户侧栏 &lt;/aside&gt;</text>

  <!-- Inner: pages/users/[id] -->
  <rect x="64" y="152" width="392" height="120" rx="8" class="box-inner" stroke-width="1.5"/>
  <text x="80" y="174" class="label" fill="#059669">pages/users/[id]</text>
  <text x="80" y="198" class="detail" fill="#6b7280">页面组件</text>
  <text x="80" y="218" class="detail" fill="#6b7280">props ← loader 返回的数据</text>

  <!-- children/slot arrows -->
  <text x="400" y="110" text-anchor="end" class="detail" fill="#7c3aed">children / slot ↓</text>
  <text x="400" y="166" text-anchor="end" class="detail" fill="#2563eb">children / slot ↓</text>
</svg>
